services:
  postgres:
    image: postgres:15
    container_name: phoneme-postgres-compose

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phoneme_builder

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d phoneme_builder"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: phoneme-nextjs-app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/phoneme_builder

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: